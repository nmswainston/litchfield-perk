<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary SEO -->
    <title>Litchfield Perk — Litchfield Park's Friendly Neighborhood Cafe</title>
    <meta
      name="description"
      content="Fresh coffee, baked goods, and good vibes in Litchfield Park, Arizona. Order ahead, explore our menu, and see today's specials."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://litchfieldperk.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Litchfield Perk — Litchfield Park's Friendly Neighborhood Cafe"
    />
    <meta
      property="og:description"
      content="Fresh coffee, baked goods, and good vibes in Litchfield Park, Arizona."
    />
    <meta property="og:url" content="https://litchfieldperk.com/" />
    <meta property="og:site_name" content="Litchfield Perk" />
    <meta property="og:image" content="https://litchfieldperk.com/logo-512.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Litchfield Perk — Litchfield Park's Friendly Neighborhood Cafe"
    />
    <meta
      name="twitter:description"
      content="Fresh coffee, baked goods, and good vibes in Litchfield Park, Arizona."
    />
    <meta name="twitter:image" content="https://litchfieldperk.com/logo-512.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#0B6534" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/android-chrome-192x192.png"
    />

    <!-- Manifest -->
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Preload hero logo (LCP element) so it loads before React renders -->
    <link rel="preload" as="image" type="image/webp" href="/src/assets/logo-512.webp" fetchpriority="high" />


    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Urbanist:wght@300;400;500;600;700&family=Caveat:wght@400;500;600;700&family=Marck+Script:wght@400&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Urbanist:wght@300;400;500;600;700&family=Caveat:wght@400;500;600;700&family=Marck+Script:wght@400&display=swap" /></noscript>
    <link rel="preconnect" href="https://snapwidget.com" />

    <!-- Local Business Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CafeOrCoffeeShop",
        "name": "Litchfield Perk",
        "url": "https://litchfieldperk.com",
        "description": "Fresh coffee, baked goods, and good vibes in Litchfield Park, Arizona.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "4870 N. Litchfield Rd. Ste. 103",
          "addressLocality": "Litchfield Park",
          "addressRegion": "AZ",
          "postalCode": "85340",
          "addressCountry": "US"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday"],
            "opens": "07:00",
            "closes": "14:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Friday", "Saturday"],
            "opens": "07:00",
            "closes": "15:00"
          }
        ],
        "priceRange": "$$",
        "servesCuisine": ["Coffee", "Pastry"],
        "image": "https://litchfieldperk.com/logo-512.png",
        "sameAs": [
          "https://www.instagram.com/litchfieldperk",
          "https://www.facebook.com/litchfieldperk",
          "https://www.tiktok.com/@litchfieldperk"
        ]
      }
    </script>

    <!-- Mobile App Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "MobileApplication",
            "name": "Litchfield Perk",
            "operatingSystem": "iOS",
            "applicationCategory": "Food & Drink",
            "installUrl": "https://apps.apple.com/us/app/litchfield-perk/id6747682541"
          },
          {
            "@type": "MobileApplication",
            "name": "Litchfield Perk",
            "operatingSystem": "Android",
            "applicationCategory": "Food & Drink",
            "installUrl": "https://play.google.com/store/apps/details?id=co.frostbyte.litchfieldperk"
          }
        ]
      }
    </script>
    <!-- Visitor counts (Umami: no cookies, no personal data). The website id is public. Caret reads the numbers from Umami. -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="5b64e658-a5ed-4e0c-94d5-ce511c1ac2a2"
      data-domains="litchfieldperk.com,www.litchfieldperk.com"
      data-exclude-hash="true"
    ></script>
  </head>

  <body>
    <div id="root"></div>
    <!-- Hidden form for Netlify Forms detection (Wholesale Contact Form) -->
    <!-- This form is required for Netlify to detect the form at build time in SPAs -->
    <form name="wholesale-contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="wholesale-contact" />
      <input type="text" name="name" autocomplete="name" />
      <input type="text" name="businessName" autocomplete="organization" />
      <input type="email" name="email" autocomplete="email" />
      <input type="tel" name="phone" autocomplete="tel" />
      <textarea name="message" autocomplete="off"></textarea>
      <input type="text" name="bot-field" autocomplete="off" />
    </form>
    <script type="module" src="/src/app/main.jsx"></script>
  </body>
</html>
